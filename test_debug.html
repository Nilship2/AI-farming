<div id="errors" style="color:red;font-family:monospace;white-space:pre-wrap"></div>
<script>
window.onerror = function(msg, url, line, col, err) {
    document.getElementById("errors").textContent += "ERROR: " + msg + " at line " + line + ":" + col + "\n";
    if (err && err.stack) document.getElementById("errors").textContent += err.stack + "\n";
    return false;
};
console.error = function() {
    var args = Array.prototype.slice.call(arguments);
    document.getElementById("errors").textContent += "CONSOLE: " + args.join(" ") + "\n";
};
</script>
