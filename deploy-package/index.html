<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>农场增量</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#1a0a00,#3d1c00,#5c3a1e);color:#f0e0c0;min-height:100vh;overflow-x:hidden;font-size:15px;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;cursor:default}
#app{max-width:940px;margin:0 auto;padding:10px}
#header{text-align:center;padding:14px 0}
#header h1{font-size:2em;color:#ffd700;text-shadow:0 0 20px rgba(255,215,0,.5)}
#header .sub{font-size:.95em;color:#ffcc80}
#header .weather{font-size:.85em;color:#90caf9}
#rbar{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;padding:10px;background:rgba(0,0,0,.3);border-radius:12px;margin:6px 0}
.r{text-align:center;min-width:75px}
.r .ic{font-size:1.4em}
.r .v{font-size:1.25em;font-weight:bold;color:#ffd700}
.r .l{font-size:.7em;color:#aaa}
#tabs{display:flex;gap:3px;flex-wrap:wrap;margin:6px 0;padding:3px;background:rgba(0,0,0,.2);border-radius:10px}
.tb{padding:7px 13px;border-radius:8px;cursor:pointer;font-size:.82em;background:rgba(255,255,255,.06);border:none;color:#ccc;white-space:nowrap;font-family:inherit}
.tb:hover{background:rgba(255,255,255,.15)}
.tb.ac{background:rgba(255,215,0,.22);color:#ffd700;font-weight:bold}
.pn{display:none}
.pn.ac{display:block}
.cd{background:rgba(0,0,0,.25);border-radius:11px;padding:12px;margin:6px 0;border:1px solid rgba(255,255,255,.07)}
.cd h3{margin-bottom:7px;color:#ffcc80;font-size:1em}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:7px}
.bt{display:inline-block;padding:7px 15px;border-radius:7px;border:none;cursor:pointer;font-size:.85em;font-weight:bold;color:#1a0a00;background:linear-gradient(135deg,#ffd700,#ffaa00);font-family:inherit}
.bt:hover{box-shadow:0 3px 14px rgba(255,180,0,.5)}
.bt:active{transform:scale(.96)}
.bt.sm{padding:4px 10px;font-size:.75em}
.bt.gn{background:linear-gradient(135deg,#66bb6a,#43a047)}
.bt.bl{background:linear-gradient(135deg,#42a5f5,#1e88e5)}
.bt.pu{background:linear-gradient(135deg,#ab47bc,#8e24aa)}
.bt.rd{background:linear-gradient(135deg,#ef5350,#e53935)}
.sl{background:rgba(0,0,0,.3);border-radius:9px;padding:10px;text-align:center;min-height:95px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:2px solid transparent;cursor:pointer}
.sl:hover{border-color:rgba(255,255,255,.35)}
.sl.rd{border-color:#ffd700;animation:pl 1.2s infinite}
.sl.lk{opacity:.35}
@keyframes pl{0%,100%{box-shadow:0 0 8px rgba(255,215,0,.2)}50%{box-shadow:0 0 22px rgba(255,215,0,.55)}}
.pb{width:100%;height:7px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.pf{height:100%;background:linear-gradient(90deg,#66bb6a,#43a047);transition:width .4s;border-radius:3px}#seasonProgress{transition:width 1s linear!important}
#nf{position:fixed;top:10px;right:10px;z-index:999;display:flex;flex-direction:column;gap:5px;max-width:280px;pointer-events:none}
.nt{background:rgba(0,0,0,.88);color:#ffd700;padding:8px 12px;border-radius:9px;font-size:.8em;animation:si .3s;border-left:3px solid #ffd700;pointer-events:auto}
@keyframes si{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.tt{font-size:.75em;color:#999;line-height:1.3}
.mr{display:flex;align-items:center;justify-content:space-between;padding:7px;margin:3px 0;background:rgba(255,255,255,.05);border-radius:7px;gap:6px}
.ar{display:flex;align-items:center;gap:7px;padding:6px;border-radius:7px;margin:3px 0}
.ar.un{background:rgba(255,215,0,.1)}
.ar.lk{opacity:.5}
.sf{background:rgba(139,90,43,.2);padding:10px;border-radius:9px;margin:6px 0;font-style:italic;border-left:3px solid #8b5a2b;line-height:1.5;font-size:.9em}
.sb{text-align:center;padding:6px;font-size:.75em;color:#888}.rmBtn{animation:none!important;font-size:.65em!important;padding:2px 8px!important;margin-top:4px!important}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.2)}
::-webkit-scrollbar-thumb{background:rgba(255,215,0,.25);border-radius:3px}

body.light{background:#f0ebe0;color:#1a0f05}
body.light .cd{background:rgba(139,90,43,.08);border:1px solid rgba(139,90,43,.15)}
body.light .sl{background:rgba(139,90,43,.06)}
body.light .tb{color:#3d1c00;background:rgba(139,90,43,.08)}
body.light .tb:hover{background:rgba(139,90,43,.2)}
body.light .tb.ac{background:rgba(139,90,43,.25);color:#1a0f05;font-weight:bold}
body.light #rbar{background:rgba(139,90,43,.1)}
body.light #rbar .v{color:#5a2d0c!important;font-weight:bold}
body.light #rbar .ic{color:#4a3520!important}
body.light #rbar .l{color:#5a4030!important;font-weight:bold}
body.light #rbar .v{color:#6b3a0a}
body.light .nt{background:rgba(240,235,224,.97);color:#1a0f05;border-left:3px solid #8b5a2b}
body.light .tt{color:#5a4030}
body.light .bt{color:#f5f0e8}
body.light .mr{background:rgba(139,90,43,.06)}
body.light .sb{color:#5a4030}
body.light #header h1{color:#4a2510;text-shadow:none}
body.light #header .sub{color:#4a3520}
body.light #header .weather{color:#3a6080}
body.light h3{color:#4a2510}
body.light h4{color:#5a2d0c}
body.light .sf{background:rgba(139,90,43,.12);color:#1a0f05}
body.light [style*="color:#ffd700"]{color:#7a520e!important}
body.light [style*="color:#ffcc80"]{color:#6b3a0a!important}

/* mod editor */
.me-form{display:flex;flex-direction:column;gap:8px}
.me-form label{font-size:.8em;color:#aaa}
.me-form input,.me-form select,.me-form textarea{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15);color:#f0e0c0;padding:6px 8px;border-radius:5px;font-size:.85em;font-family:inherit}
.me-form input:focus,.me-form select:focus,.me-form textarea:focus{outline:none;border-color:#ffd700}
.me-form textarea{resize:vertical;min-height:40px}
.me-entry{border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:10px;margin:6px 0;background:rgba(0,0,0,.15)}
.me-entry h4{color:#ffcc80;margin-bottom:6px;font-size:.9em}
.me-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.me-row>*{flex:1;min-width:80px}
.me-actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}

/* ========== 移动端优化 ========== */
@media (max-width:768px){
    body{font-size:14px}
    #app{padding:6px}
    #header{padding:8px 0}
    #header h1{font-size:1.4em}
    #header .sub{font-size:.8em}
    #header .weather{font-size:.75em}

    /* 资源栏: 2行3列紧凑 */
    #rbar{gap:6px;padding:8px 6px;display:grid;grid-template-columns:repeat(3,1fr)}
    #rbar .r{min-width:auto}
    #rbar .r .ic{font-size:1.1em}
    #rbar .r .v{font-size:1em}
    #rbar .r .l{font-size:.65em}

    /* 标签栏: 桌面端保持, 移动端隐藏(底部导航替代) */
    #tabs{display:none}

    /* 面板加底部留白给导航 */
    .pn.ac{padding-bottom:72px}

    /* 卡片: 双列 */
    .cg{grid-template-columns:repeat(2,1fr)!important;gap:5px}
    .sl{min-height:72px;padding:7px 5px;gap:3px;font-size:.9em}
    .sl .pb{height:5px}
    .sl .tt{font-size:.68em}

    /* 按钮触控 */
    .bt{padding:8px 14px;font-size:.82em;min-height:40px;min-width:40px}
    .bt.sm{padding:5px 10px;font-size:.72em;min-height:34px}

    /* 通知区: 顶部居中 */
    #nf{top:4px;left:5%;right:5%;max-width:90%;flex-direction:column;align-items:center}
    #nf .nt{font-size:.75em;padding:6px 10px;border-radius:7px}

    /* 内容卡片收紧 */
    .cd{padding:8px;margin:4px 0;border-radius:9px}
    .cd h3{font-size:.9em;margin-bottom:5px}

    /* MR行适配 */
    .mr{flex-wrap:wrap;padding:5px;gap:4px}

    /* 进度条 */
    .pb{height:5px}
    
    /* 页脚 */
    .sb{font-size:.65em;padding:4px;padding-bottom:70px}

    /* 弹窗 */
    #detailOverlay>div{max-width:95%!important;padding:16px!important}
    

    /* 底部导航 */
    #mobileNav{display:flex!important}
    .mnav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:#888;font-size:.65em;cursor:pointer;padding:4px 6px;border-radius:6px;min-width:48px;font-family:inherit;flex:1;max-width:72px}
    .mnav-btn span{font-size:.7em;line-height:1}
    .mnav-btn.active{color:#ffd700;background:rgba(255,215,0,.1)}
    .mnav-btn:active{background:rgba(255,215,0,.2)}
    #mobileMoreMenu .mnav-btn{flex:0 0 auto;min-width:60px;max-width:none;font-size:.7em;padding:6px 8px}

    /* 亮色主题覆盖 */
    body.light #rbar{gap:4px}
    body.light .sl{min-height:70px}
}</style>
</head>
<body>

<div id="nf"></div>
<div id="header"><h1>农场增量</h1><div class="sub" id="sn"></div><div style="width:200px;height:6px;background:rgba(255,255,255,.1);border-radius:3px;margin:4px auto;overflow:hidden"><div id="seasonProgress" style="height:100%;width:0%;background:linear-gradient(90deg,#ffd700,#ff9800);border-radius:3px;transition:width 1s"></div></div><div class="weather" id="wt"></div></div>

<div id="mobileNav" style="display:none;position:fixed;bottom:0;left:0;right:0;height:56px;background:rgba(26,10,0,.94);border-top:1px solid rgba(255,215,0,.2);z-index:998;display:none;justify-content:space-around;align-items:center;padding:0 4px">
<button class="mnav-btn active" data-pn="farm">🏠<span>农田</span></button>
<button class="mnav-btn" data-pn="animals">🐄<span>畜棚</span></button>
<button class="mnav-btn" data-pn="inventory">📦<span>库存</span></button>
<button class="mnav-btn" data-pn="upgrades">⬆<span>升级</span></button>
<button class="mnav-btn" id="mnavMore" data-pn="more">⋯<span>更多</span></button>
</div>
<div id="mobileMoreMenu" style="display:none;position:fixed;bottom:56px;left:0;right:0;background:rgba(26,10,0,.97);border-top:1px solid rgba(255,215,0,.2);z-index:997;padding:8px;max-height:50vh;overflow-y:auto;flex-wrap:wrap;gap:4px">
</div><script>
// ========== 移动端底部导航 ==========
(function(){
    function isMobile(){return window.innerWidth<=768;}
    
    function buildMoreMenu(){
        var menu=document.getElementById("mobileMoreMenu");
        if(!menu)return;
        var allTabs=["farm","animals","process","upgrades","trade","bestiary","achievements","journal","prestige","relics","tutorial","research","inventory","system","modedit","techtree","modcom"];
        var mainNav=["farm","animals","inventory","upgrades"];
        var html='';
        for(var i=0;i<allTabs.length;i++){
            var pn=allTabs[i];
            if(mainNav.indexOf(pn)!==-1)continue;
            var dt=document.querySelector('#tabs [data-pn="'+pn+'"]');
            if(!dt||dt.style.display==="none")continue;
            html+='<button class="mnav-btn" data-pn="'+pn+'">'+dt.textContent.trim()+'</button>';
        }
        menu.innerHTML=html;
    }

    function switchTab(pn){
        var dt=document.querySelector('#tabs [data-pn="'+pn+'"]');
        if(dt)dt.click();
        // Update active highlight
        var allBtns=document.querySelectorAll(".mnav-btn");
        for(var i=0;i<allBtns.length;i++)allBtns[i].classList.remove("active");
        var active=document.querySelector('.mnav-btn[data-pn="'+pn+'"]');
        if(active)active.classList.add("active");
        document.getElementById("mobileMoreMenu").style.display="none";
        window.scrollTo(0,0);
    }

    function init(){
        if(!isMobile())return;
        var nav=document.getElementById("mobileNav");
        if(!nav)return;
        nav.style.display="flex";
        buildMoreMenu();

        // Main nav buttons
        var btns=nav.querySelectorAll(".mnav-btn");
        for(var i=0;i<btns.length;i++){
            btns[i].addEventListener("click",function(){
                var pn=this.getAttribute("data-pn");
                if(pn==="more"){
                    var menu=document.getElementById("mobileMoreMenu");
                    var show=menu.style.display!=="flex";
                    menu.style.display=show?"flex":"none";
                    this.classList.toggle("active",show);
                }else{
                    switchTab(pn);
                }
            });
        }

        // More menu buttons
        document.getElementById("mobileMoreMenu").addEventListener("click",function(e){
            var btn=e.target.closest(".mnav-btn");
            if(!btn)return;
            var pn=btn.getAttribute("data-pn");
            if(pn)switchTab(pn);
        });

        // Listen for tab changes to update active state
        var tabs=document.getElementById("tabs");
        if(tabs){
            tabs.addEventListener("click",function(){
                setTimeout(function(){
                    var at=tabs.querySelector(".tb.ac");
                    if(!at)return;
                    var pn=at.getAttribute("data-pn");
                    var allBtns=document.querySelectorAll(".mnav-btn");
                    for(var i=0;i<allBtns.length;i++){
                        allBtns[i].classList.toggle("active",allBtns[i].getAttribute("data-pn")===pn);
                    }
                    document.getElementById("mobileMoreMenu").style.display="none";
                },100);
            });
        }

        // Sync more menu when mod community / mod edit tabs appear
        setInterval(function(){
            var menu=document.getElementById("mobileMoreMenu");
            if(menu&&menu.style.display==="flex")buildMoreMenu();
        },2000);
    }

    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);
    else setTimeout(init,200);
})();
</script>
